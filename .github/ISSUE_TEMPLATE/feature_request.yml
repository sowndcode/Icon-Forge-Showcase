name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The app is local-first and works offline. Ideas that need accounts, cloud services,
        telemetry or network access are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, e.g. "I need a 800×450 cover for a store that isn't in the presets".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches or reference images are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've tried
